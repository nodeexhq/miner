name: release

# Pushing a tag such as v0.2.0 builds, signs, notarizes and publishes
# everything owners download: the command-line nvto-node and the NVTO Node app, with
# the app's update feed pointed at the new version. Nothing is done by hand.
#
# The signing material is in the organization's secrets:
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD   the Developer ID certificate
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD  for Apple's notary service
#   SPARKLE_PRIVATE_KEY                          signs the app's updates
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ github.ref_name }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the count of commits, and the tag names the version.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - run: cd vmnet && go test -count=1 ./...
      - run: swift test --package-path app

      - name: Signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: echo "SIGN_IDENTITY=$(scripts/ci-signing.sh)" >> "$GITHUB_ENV"

      - name: Command-line nvto-node
        run: |
          mkdir -p dist/nvto-node
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$TAG" \
            -o dist/nvto-node/nvto-node ./cmd/nvto-node
          scripts/sign-binary.sh dist/nvto-node/nvto-node
          cp LICENSE README.md dist/nvto-node/
          tar -C dist -czf "dist/nvto-node_${TAG}_macos_arm64.tar.gz" nvto-node
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)

      - name: The app
        run: VERSION="$TAG" app/scripts/package.sh

      - name: Publish
        run: |
          # A test build (a tag with a suffix) is a pre-release and is never shown
          # as the download; a plain tag is the release everyone gets.
          case "$TAG" in *-*) KIND=--prerelease ;; *) KIND=--latest ;; esac
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS $KIND --title "NVTO Node $TAG" \
            --notes "The command-line nvto-node and the NVTO Node app for macOS on Apple silicon, signed with a Developer ID and notarized by Apple. Verify downloads against the checksums."

      - name: The app, for a test build
        if: ${{ contains(github.ref_name, '-') }}
        run: gh release upload "$TAG" app/dist/NVTO-Node-"$TAG".dmg --clobber

      - name: Update feed
        # A test build (a tag with a suffix, such as v0.1.16-test.1) is published
        # for trying on one machine; installed apps are not offered it.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle.key" app/scripts/publish.sh "$TAG"
          rm -f "$RUNNER_TEMP/sparkle.key"
          # Installed apps read the feed from the main branch.
          cp app/feed.xml "$RUNNER_TEMP/feed.xml"
          git fetch -q origin main
          git checkout -q -f -B main origin/main
          cp "$RUNNER_TEMP/feed.xml" app/feed.xml
          git config user.name "NVTO"
          git config user.email "hello@nvto.com"
          git add app/feed.xml
          git commit -q -m "Update feed: $TAG"
          git push -q origin main
