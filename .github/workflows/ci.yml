name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
      # The Miner runs on macOS only; the packages NodeEx Connect imports
      # must keep building for every system renters use.
      - run: GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/nodeex-miner
      - run: |
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build ./gate ./leasetoken ./overlay ./tunnel
          done

  # The macOS app around the Miner (app/): Swift, so it builds on a Mac.
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path app
      - run: swift test --package-path app
